<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruleta Rusa: El Revólver de Marvel Moreno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090e;
      --card: #15151f;
      --red: #ff3366;
      --gold: #ffb703;
      --green: #06d6a0;
      --purple: #7209b7;
      --text: #f8f9fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #241226 0%, var(--bg) 85%);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      text-align: center;
      user-select: none;
    }
    header { margin-top: 6px; margin-bottom: 12px; }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: #fff;
    }
    h1 span {
      color: var(--red);
      font-family: 'Space Grotesk', sans-serif;
      display: block;
      font-size: 0.8rem;
      letter-spacing: 2px;
      margin-top: 4px;
    }

    /* Tambor visual */
    .cylinder-wrap {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: #111118;
      border: 4px solid #29293d;
      box-shadow: 0 0 25px rgba(0,0,0,0.8), inset 0 0 15px #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px auto 14px;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .cylinder-center {
      width: 44px;
      height: 44px;
      background: #08080b;
      border: 3px solid #3d3d54;
      border-radius: 50%;
    }
    .chamber {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #20202e;
      border: 2px solid #3d3d54;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #666;
      transition: all 0.3s;
    }
    .c1 { top: 8px; left: 67px; }
    .c2 { top: 37px; right: 12px; }
    .c3 { bottom: 37px; right: 12px; }
    .c4 { bottom: 8px; left: 67px; }
    .c5 { bottom: 37px; left: 12px; }
    .c6 { top: 37px; left: 12px; }

    .chamber.has-bullet {
      background: radial-gradient(circle, #ff5c8a 20%, var(--red) 90%);
      color: #fff;
      border-color: #fff;
      box-shadow: 0 0 12px var(--red);
    }

    .panel {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid #29293d;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      margin-bottom: 16px;
    }
    select, button {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      margin-top: 10px;
    }
    select {
      background: #1f1f2e;
      border: 1px solid #3d3d54;
      color: #fff;
    }
    .btn-main {
      background: var(--gold);
      color: #000;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #3d3d54;
      color: #aaa;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .case-box {
      background: #101018;
      border-left: 4px solid var(--gold);
      padding: 14px;
      border-radius: 8px;
      margin: 12px 0;
      text-align: left;
      font-size: 0.88rem;
      line-height: 1.45;
    }

    /* Opciones neutras para debate difícil */
    .options-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-choice {
      background: rgba(30, 32, 48, 0.9);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px 14px;
      color: #f1f5f9;
      text-align: left;
      cursor: pointer;
      font-size: 0.85rem;
      line-height: 1.4;
      transition: all 0.2s ease;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 0;
    }

    .btn-choice:hover {
      border-color: var(--gold);
      background: rgba(255, 183, 3, 0.1);
    }

    .choice-badge {
      background: var(--gold);
      color: #000;
      font-weight: 900;
      font-size: 0.78rem;
      padding: 3px 7px;
      border-radius: 6px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .flash {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.05s ease-out;
      z-index: 9999;
    }
    .flash.active { opacity: 0.95; }
    .feedback {
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      line-height: 1.45;
      text-align: left;
      display: none;
    }

    .closing-reflection {
      background: rgba(255, 183, 3, 0.1);
      border: 1.5px solid var(--gold);
      padding: 16px;
      border-radius: 12px;
      margin-top: 14px;
      text-align: left;
      font-size: 0.88rem;
      line-height: 1.5;
      color: #fff;
    }

    .hearts-bar {
      font-size: 1.15rem;
      letter-spacing: 3px;
      transition: all 0.3s ease;
    }

    .qr-card {
      background: rgba(255, 183, 3, 0.05);
      border: 1.5px solid var(--gold);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.82rem;
    }

    .leaderboard-table th, .leaderboard-table td {
      padding: 8px 6px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .leaderboard-table th {
      color: var(--gold);
      font-size: 0.72rem;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div id="flash-screen" class="flash"></div>

  <header>
    <h1>RULETA RUSA<span>EL REVÓLVER DE MARVEL MORENO</span></h1>
  </header>

  <!-- Selección inicial & QR -->
  <div class="panel" id="box-login">
    <div class="qr-card">

      <div id="qr-code-svg" style="background:#fff; padding:8px; border-radius:10px;"></div>

  <!-- Interfaz de la Ruleta -->

    <!-- Indicador de 6 Corazones (1 por cada recámara) -->

    <div class="feedback" id="feedback-box"></div>

  </div>

    <button class="btn-secondary" onclick="resetLeaderboard()" style="margin-top:10px;">🔄 Reiniciar Posiciones de la Clase</button>

  <script>
    // Generador QR inline SVG
    function generateQRInlineSVG(text, size = 150) {
      const encoded = encodeURIComponent(text);
      const googleChartApi = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encoded}&margin=0`;
      return `<img src="${googleChartApi}" width="${size}" height="${size}" alt="Código QR" style="display:block; border-radius:6px;"/>`;
    }

    const joinUrl = window.location.origin;
    document.getElementById('qr-code-svg').innerHTML = generateQRInlineSVG(joinUrl, 150);
    document.getElementById('qr-url-text').innerText = joinUrl;

    // Sintetizador Web Audio API
    class SoundFX {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playSpin() {
        this.init();
        if (!this.ctx) return;
        for (let i = 0; i < 6; i++) {
          setTimeout(() => {
            try {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(800 + i * 50, this.ctx.currentTime);
              gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start();
              osc.stop(this.ctx.currentTime + 0.04);
            } catch (e) {}
          }, i * 70);
        }
      }
      playBang() {
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const bufferSize = this.ctx.sampleRate * 0.45;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1200, now);
          filter.frequency.exponentialRampToValueAtTime(70, now + 0.4);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(now);
          noise.stop(now + 0.45);
        } catch (e) {}
      }
      playClick() {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.06);
        } catch (e) {}
      }
      playChime() {
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.08);
            gain.gain.setValueAtTime(0.2, now + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.3);
          });
        } catch (e) {}
      }
    }
    const audio = new SoundFX();

            esLimiteFirme: false,
            balasAdd: 2,
            corazonesCost: 2,
            explicacion: "🚨 <b>SUMISIÓN DE APARIENCIAS:</b> Como Ana María al inicio del cuento, la tolerancia por imagen pública llena el tambor de balas."
          },
          {
            texto: "Hacer un reclamo impulsivo en redes sociales sin pruebas ni plan de contingencia personal.",
            esLimiteFirme: false,
            balasAdd: 1,
            corazonesCost: 1,
            explicacion: "⚠️ <b>DESAHOGO SIN ESTRATEGIA:</b> Expones el conflicto sin construir un cerco de protección efectivo ni asesoría."
          },
          {
            texto: "Documentar evidencias, apoyarte en personas de confianza y establecer un límite irreversible (la estrategia del revólver).",
            esLimiteFirme: true,
            balasAdd: -1,
            corazonesCost: 0,
            explicacion: "🛑 <b>DESARME DEFINITIVO:</b> Como Ana María al tomar el revólver, inviertes el poder y marcas una frontera inquebrantable."
          }
        ]
      }
    ];

    let equipoActualId = "1";
    let nombreEquipo = "EQUIPO 1";
    let rondaActual = 0;
    let balasEnTambor = 1;
    let corazonesRestantes = 6; // ❤️ 6 Corazones de Salud Relacional
    let puntosEquipo = 0;
    let limitesPuestosCount = 0;
    let angulo = 0;

    let leaderboard = JSON.parse(localStorage.getItem('revolver_leaderboard')) || {
      "1": { equipo: "Equipo 1", puntos: 0, corazones: 6, estado: "En Espera" },
      "2": { equipo: "Equipo 2", puntos: 0, corazones: 6, estado: "En Espera" },
      "3": { equipo: "Equipo 3", puntos: 0, corazones: 6, estado: "En Espera" },
      "4": { equipo: "Equipo 4", puntos: 0, corazones: 6, estado: "En Espera" },
      "5": { equipo: "Equipo 5", puntos: 0, corazones: 6, estado: "En Espera" },
      "6": { equipo: "Equipo 6", puntos: 0, corazones: 6, estado: "En Espera" }
    };

    function renderLeaderboard() {
      const container = document.getElementById('leaderboard-container');
      const sorted = Object.keys(leaderboard).map(k => ({ id: k, ...leaderboard[k] }))
        .sort((a, b) => b.puntos - a.puntos);

      let html = `
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>Pos</th>
              <th>Equipo</th>
              <th>Salud (6❤️)</th>
              <th>Puntos</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
      `;

      sorted.forEach((item, index) => {
        const medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `${index + 1}º`;
        const heartsTxt = "❤️".repeat(Math.max(0, item.corazones)) + "💔".repeat(Math.max(0, 6 - item.corazones));
        html += `
          <tr>
            <td><strong>${medal}</strong></td>
            <td><strong>${item.equipo}</strong></td>
            <td style="font-size:0.75rem;">${heartsTxt}</td>
            <td><strong style="color:var(--gold);">${item.puntos} pts</strong></td>
            <td><span style="font-size:0.72rem; padding:2px 5px; border-radius:4px; background:${item.estado.includes('Sobrevivió') ? 'rgba(6,214,160,0.2)' : item.estado.includes('Colapsó') ? 'rgba(255,51,102,0.2)' : 'rgba(255,255,255,0.06)'}; color:${item.estado.includes('Sobrevivió') ? 'var(--green)' : item.estado.includes('Colapsó') ? 'var(--red)' : '#aaa'};">${item.estado}</span></td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
      localStorage.setItem('revolver_leaderboard', JSON.stringify(leaderboard));
    }

    function resetLeaderboard() {
      if (confirm("¿Deseas reiniciar la tabla de posiciones de todos los grupos?")) {
        leaderboard = {
          "1": { equipo: "Equipo 1", puntos: 0, corazones: 6, estado: "En Espera" },
          "2": { equipo: "Equipo 2", puntos: 0, corazones: 6, estado: "En Espera" },
          "3": { equipo: "Equipo 3", puntos: 0, corazones: 6, estado: "En Espera" },
          "4": { equipo: "Equipo 4", puntos: 0, corazones: 6, estado: "En Espera" },
          "5": { equipo: "Equipo 5", puntos: 0, corazones: 6, estado: "En Espera" },
          "6": { equipo: "Equipo 6", puntos: 0, corazones: 6, estado: "En Espera" }
        };
        renderLeaderboard();
      }
    }

    function actualizarCorazonesUI() {
      const el = document.getElementById('lbl-corazones');
      if (corazonesRestantes > 0) {
        el.innerText = "❤️".repeat(corazonesRestantes) + "💔".repeat(6 - corazonesRestantes);
      } else {
        el.innerText = "💔💔💔💔💔💔 (COLAPSO TOTAL)";
      }
    }

    function entrarJuego() {
      audio.playClick();
      const sel = document.getElementById('sel-grupo');
      equipoActualId = sel.value;
      nombreEquipo = sel.options[sel.selectedIndex].text.toUpperCase();

      rondaActual = 0;
      balasEnTambor = 1;
      corazonesRestantes = 6;
      puntosEquipo = 0;
      limitesPuestosCount = 0;

      document.getElementById('box-login').style.display = 'none';
      document.getElementById('box-game').style.display = 'block';
      document.getElementById('lbl-grupo').innerText = nombreEquipo;

      actualizarCorazonesUI();
      actualizarTambor();
      mostrarRonda();
    }

    function mostrarRonda() {
      if (corazonesRestantes <= 0) {
        audio.playBang();
        leaderboard[equipoActualId] = {
          equipo: nombreEquipo,
          puntos: puntosEquipo,
          corazones: 0,
          estado: "💥 Colapsó"
        };
        renderLeaderboard();

        document.getElementById('case-title').innerText = "💔 LA RELACIÓN HA COLAPSADO";
        document.getElementById('case-desc').innerHTML = `
          Se agotaron los 6 corazones de salud emocional. Ceder ante el control o escalar la agresión acumuló demasiadas balas y causó un daño irreversible.
          <br><br>
          <strong>Puntuación Final:</strong> ${puntosEquipo} pts.
        `;
        document.getElementById('actions-panel').style.display = 'none';
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('btn-next').style.display = 'none';
        return;
      }

      if (rondaActual >= situaciones.length) {
        audio.playChime();
        const bonoFinal = corazonesRestantes * 100;
        puntosEquipo += bonoFinal;

        leaderboard[equipoActualId] = {
          equipo: nombreEquipo,
          puntos: puntosEquipo,
          corazones: corazonesRestantes,
          estado: "🏆 Sobrevivió"
        };
        renderLeaderboard();

        document.getElementById('case-title').innerText = "SOBREVIVISTE A LA RULETA";
        document.getElementById('case-desc').innerHTML = `
          Demostraron discernment crítico: en una relación abusiva, tolerar o ceder es jugar a la ruleta rusa. Poner límites contundentes e innegociables desarmó la violencia.
          <br><br>
          <strong>🎯 Puntuación Final: ${puntosEquipo} pts</strong> (Bono por ${corazonesRestantes} corazones preservados).
          <div class="closing-reflection">
            <strong style="color:var(--gold); display:block; margin-bottom:6px;">📖 CIERRE REFLEXIVO (MARVEL MORENO):</strong>
            "En el cuento de Marvel Moreno, Ana María estuvo jugando a la ruleta rusa cada vez que toleraba los maltratos de José Caicedo para cuidar las apariencias sociales, hasta que el carro casi la mata en el garaje. Solo cuando consiguió el revólver y puso un límite irreversible, logró vaciar el tambor y obligar al agresor a vivir con miedo durante treinta años."
          </div>
        `;
        document.getElementById('actions-panel').style.display = 'none';
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('btn-next').style.display = 'none';
        return;
      }

      const s = situaciones[rondaActual];
      document.getElementById('case-title').innerText = `CASO ${rondaActual + 1} DE 6: ${s.titulo}`;
      document.getElementById('case-desc').innerText = s.desc;

      // Renderizar 3 opciones de respuesta complejas (sin colores obvios)
      const actionsPanel = document.getElementById('actions-panel');
      let optionsHTML = '';
      const letters = ['A', 'B', 'C'];

      s.opciones.forEach((opc, idx) => {
        optionsHTML += `
          <button class="btn-choice" onclick="tomarDecision(${idx})">
            <span class="choice-badge">OPCIÓN ${letters[idx]}</span>
            <span>${opc.texto}</span>
          </button>
        `;
      });
      actionsPanel.innerHTML = optionsHTML;

      document.getElementById('feedback-box').style.display = 'none';
      document.getElementById('btn-next').style.display = 'none';
      document.getElementById('actions-panel').style.display = 'flex';
    }

    function actualizarTambor() {
      for (let i = 0; i < 6; i++) {
        document.getElementById(`slot-${i}`).className = "chamber " + `c${i+1}`;
      }
      for (let i = 0; i < balasEnTambor; i++) {
        document.getElementById(`slot-${i}`).classList.add('has-bullet');
      }
      document.getElementById('lbl-balas').innerText = `Balas: ${balasEnTambor}/6`;
    }

    function girarTambor(callback) {
      audio.playSpin();
      angulo += 360 + Math.floor(Math.random() * 6) * 60;
      document.getElementById('tambor').style.transform = `rotate(${angulo}deg)`;
      setTimeout(callback, 650);
    }

    function tomarDecision(optIdx) {
      document.getElementById('actions-panel').style.display = 'none';
      const fb = document.getElementById('feedback-box');
      fb.style.display = 'block';
      document.getElementById('btn-next').style.display = 'block';

      const s = situaciones[rondaActual];
      const elegida = s.opciones[optIdx];

      if (!elegida.esLimiteFirme) {
        // Causalidad: Añade balas y resta corazones
        balasEnTambor = Math.min(6, balasEnTambor + elegida.balasAdd);
        corazonesRestantes = Math.max(0, corazonesRestantes - elegida.corazonesCost);
        actualizarCorazonesUI();
        actualizarTambor();

        girarTambor(() => {
          const disparo = Math.random() < (balasEnTambor / 6);
          if (disparo) {
            audio.playBang();
            corazonesRestantes = Math.max(0, corazonesRestantes - 1);
            actualizarCorazonesUI();

            if (navigator.vibrate) navigator.vibrate([150, 50, 150]);
            const f = document.getElementById('flash-screen');
            f.classList.add('active');
            setTimeout(() => f.classList.remove('active'), 120);

            fb.style.background = '#381216';
            fb.style.border = '1px solid var(--red)';
            fb.style.color = '#ffccd5';
            fb.innerHTML = `💥 <b>¡BANG! EL DISPARO SE ACTIVÓ (💔 Pierden 1 Corazón Extra)</b><br>${elegida.explicacion}<br><br><small>Quedan ${corazonesRestantes} corazones de vida relacional.</small>`;
          } else {
            audio.playClick();
            puntosEquipo += 40;
            fb.style.background = '#2b2310';
            fb.style.border = '1px solid var(--gold)';
            fb.style.color = '#ffe082';
            fb.innerHTML = `⚠️ <b>CLIC... TE SALVASTE POR SUERTE (+40 pts)</b><br>${elegida.explicacion}<br><br><small>El tambor tiene ${balasEnTambor} balas cargadas.</small>`;
          }

          leaderboard[equipoActualId] = {
            equipo: nombreEquipo,
            puntos: puntosEquipo,
            corazones: corazonesRestantes,
            estado: corazonesRestantes > 0 ? "Jugando" : "💥 Colapsó"
          };
          renderLeaderboard();
        });

      } else {
        // Opción Límite Firme: Vacia bala y protege salud
        balasEnTambor = Math.max(1, balasEnTambor + elegida.balasAdd);
        limitesPuestosCount++;
        puntosEquipo += 150;
        actualizarTambor();

        girarTambor(() => {
          audio.playChime();
          fb.style.background = '#0e2b24';
          fb.style.border = '1px solid var(--green)';
          fb.style.color = '#c7f9cc';
          fb.innerHTML = `🛑 <b>LÍMITE FIRME Y EFECTIVO (+150 pts)</b><br>${elegida.explicacion}<br><br><small>Vaciaron 1 bala del tambor y protegieron sus 6 corazones.</small>`;

          leaderboard[equipoActualId] = {
            equipo: nombreEquipo,
            puntos: puntosEquipo,
            corazones: corazonesRestantes,
            estado: "Jugando"
          };
          renderLeaderboard();
        });
      }
    }

    function siguienteRonda() {
      audio.playClick();
      rondaActual++;
      mostrarRonda();
    }

    renderLeaderboard();
  </script>
</body>
</html>
