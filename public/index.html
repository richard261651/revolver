<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruleta Rusa: El Revólver de Marvel Moreno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090e;
      --card: #15151f;
      --red: #ff3366;
      --gold: #ffb703;
      --green: #06d6a0;
      --text: #f8f9fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #241226 0%, var(--bg) 85%);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      text-align: center;
      user-select: none;
    }
    header { margin-top: 6px; margin-bottom: 12px; }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: #fff;
    }
    h1 span {
      color: var(--red);
      font-family: 'Space Grotesk', sans-serif;
      display: block;
      font-size: 0.8rem;
      letter-spacing: 2px;
      margin-top: 4px;
    }

    /* Tambor visual */
    .cylinder-wrap {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: #111118;
      border: 4px solid #29293d;
      box-shadow: 0 0 25px rgba(0,0,0,0.8), inset 0 0 15px #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px auto 16px;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .cylinder-center {
      width: 44px;
      height: 44px;
      background: #08080b;
      border: 3px solid #3d3d54;
      border-radius: 50%;
    }
    .chamber {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #20202e;
      border: 2px solid #3d3d54;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #666;
      transition: all 0.3s;
    }
    .c1 { top: 8px; left: 67px; }
    .c2 { top: 37px; right: 12px; }
    .c3 { bottom: 37px; right: 12px; }
    .c4 { bottom: 8px; left: 67px; }
    .c5 { bottom: 37px; left: 12px; }
    .c6 { top: 37px; left: 12px; }

    .chamber.has-bullet {
      background: radial-gradient(circle, #ff5c8a 20%, var(--red) 90%);
      color: #fff;
      border-color: #fff;
      box-shadow: 0 0 12px var(--red);
    }

    .panel {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid #29293d;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      margin-bottom: 16px;
    }
    select, button {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      margin-top: 10px;
    }
    select {
      background: #1f1f2e;
      border: 1px solid #3d3d54;
      color: #fff;
    }
    .btn-main {
      background: var(--gold);
      color: #000;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #3d3d54;
      color: #aaa;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .case-box {
      background: #101018;
      border-left: 4px solid var(--gold);
      padding: 14px;
      border-radius: 8px;
      margin: 12px 0;
      text-align: left;
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .btn-action {
      border: none;
      font-weight: 700;
      color: white;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.85rem;
      padding: 12px;
      border-radius: 8px;
      width: 50%;
    }
    .btn-tolerate { background: #d62828; }
    .btn-limit { background: var(--green); color: #000; }

    .flash {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.05s ease-out;
      z-index: 9999;
    }
    .flash.active { opacity: 0.95; }
    .feedback {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.4;
      display: none;
    }

    .closing-reflection {
      background: rgba(255, 183, 3, 0.1);
      border: 1.5px solid var(--gold);
      padding: 16px;
      border-radius: 12px;
      margin-top: 14px;
      text-align: left;
      font-size: 0.88rem;
      line-height: 1.5;
      color: #fff;
    }

    .hearts-bar {
      font-size: 1.25rem;
      letter-spacing: 4px;
      margin-top: 4px;
      transition: all 0.3s ease;
    }

    .qr-card {
      background: rgba(255, 183, 3, 0.05);
      border: 1.5px solid var(--gold);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .leaderboard-box {
      margin-top: 16px;
      background: rgba(21, 21, 31, 0.9);
      border: 1px solid #29293d;
      border-radius: 12px;
      padding: 14px;
      text-align: left;
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.85rem;
    }

    .leaderboard-table th, .leaderboard-table td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .leaderboard-table th {
      color: var(--gold);
      font-size: 0.75rem;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div id="flash-screen" class="flash"></div>

  <header>
    <h1>RULETA RUSA<span>EL REVÓLVER DE MARVEL MORENO</span></h1>
  </header>

  <!-- Selección inicial & QR -->
  <div class="panel" id="box-login">
    <div class="qr-card">
      <div style="font-size: 0.8rem; font-weight: 800; color: var(--gold); margin-bottom: 8px; letter-spacing: 1px;">
        📱 ESCANEA PARA UNIRTE CON TU EQUIPO
      </div>
      <div id="qr-code-svg" style="background:#fff; padding:8px; border-radius:10px;"></div>
      <div style="font-size: 0.78rem; color: #aaa; margin-top: 8px; word-break: break-all;" id="qr-url-text"></div>
    </div>

    <p style="font-size: 0.88rem; color: #aaa;">Selecciona tu equipo para entrar a la mesa de riesgo:</p>
    <select id="sel-grupo">
      <option value="1">Equipo 1</option>
      <option value="2">Equipo 2</option>
      <option value="3">Equipo 3</option>
      <option value="4">Equipo 4</option>
      <option value="5">Equipo 5</option>
      <option value="6">Equipo 6</option>
    </select>
    <button class="btn-main" onclick="entrarJuego()">Entrar a la Ruleta</button>
  </div>

  <!-- Interfaz de la Ruleta -->
  <div class="panel" id="box-game" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span id="lbl-grupo" style="color:var(--gold); font-weight:700; font-size:0.85rem;"></span>
      <span id="lbl-balas" style="color:var(--red); font-weight:700; font-size:0.85rem;">Balas: 1/6</span>
    </div>

    <!-- Indicador de Vidas / Corazones de la Relación -->
    <div style="margin-top: 6px; display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.3); padding:8px 12px; border-radius:8px;">
      <span style="font-size:0.75rem; color:#aaa; font-weight:bold;">Salud de la Relación:</span>
      <div class="hearts-bar" id="lbl-corazones">❤️❤️❤️</div>
    </div>

    <!-- Tambor giratorio -->
    <div class="cylinder-wrap" id="tambor">
      <div class="cylinder-center"></div>
      <div class="chamber c1" id="slot-0">1</div>
      <div class="chamber c2" id="slot-1">2</div>
      <div class="chamber c3" id="slot-2">3</div>
      <div class="chamber c4" id="slot-3">4</div>
      <div class="chamber c5" id="slot-4">5</div>
      <div class="chamber c6" id="slot-5">6</div>
    </div>

    <!-- Caso en disputa -->
    <div class="case-box">
      <strong style="color:var(--gold); display:block; margin-bottom:4px;" id="case-title">RONDA 1</strong>
      <p id="case-desc"></p>
    </div>

    <!-- Acciones -->
    <div style="display:flex; gap:10px;" id="actions-panel">
      <button class="btn-action btn-tolerate" onclick="tomarDecision('tolerar')">
        <span>🤫 DEJAR PASAR</span>
        <small style="font-size:0.7rem; font-weight:normal; opacity:0.85;">(Añades 1 bala y jalas gatillo)</small>
      </button>
      <button class="btn-action btn-limit" onclick="tomarDecision('limite')">
        <span>🛑 PONER LÍMITE</span>
        <small style="font-size:0.7rem; font-weight:normal; opacity:0.85;">(Quitas 1 bala y aseguras)</small>
      </button>
    </div>

    <div class="feedback" id="feedback-box"></div>
    <button class="btn-main" id="btn-next" style="display:none;" onclick="siguienteRonda()">Siguiente Situación ➔</button>
  </div>

  <!-- TOP DE POSICIONES DE GRUPOS -->
  <div class="panel">
    <div style="font-size:0.85rem; font-weight:bold; color:var(--gold); display:flex; justify-content:space-between; align-items:center;">
      <span>🏆 TOP DE GRUPOS (TABLA DE POSICIONES)</span>
      <span style="font-size:0.7rem; color:#888;">Actualizado en Vivo</span>
    </div>
    <div id="leaderboard-container"></div>
    <button class="btn-secondary" onclick="resetLeaderboard()" style="margin-top:10px;">🔄 Reiniciar Posiciones de la Clase</button>
  </div>

  <script>
    // Generador de SVG QR integrado sin dependencias externas
    function generateQRInlineSVG(text, size = 160) {
      // Implementación compacta de QR SVG estilizada
      const encoded = encodeURIComponent(text);
      const googleChartApi = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encoded}&margin=0`;
      return `<img src="${googleChartApi}" width="${size}" height="${size}" alt="Código QR" style="display:block; border-radius:6px;"/>`;
    }

    // Renderizar QR en pantalla de inicio
    const joinUrl = window.location.origin;
    document.getElementById('qr-code-svg').innerHTML = generateQRInlineSVG(joinUrl, 160);
    document.getElementById('qr-url-text').innerText = joinUrl;

    // Sintetizador de Sonidos Web Audio API
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playSpin() {
        this.init();
        if (!this.ctx) return;
        for (let i = 0; i < 6; i++) {
          setTimeout(() => {
            try {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(800 + i * 50, this.ctx.currentTime);
              gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start();
              osc.stop(this.ctx.currentTime + 0.04);
            } catch (e) {}
          }, i * 70);
        }
      }
      playBang() {
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const bufferSize = this.ctx.sampleRate * 0.4;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1000, now);
          filter.frequency.exponentialRampToValueAtTime(80, now + 0.35);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(now);
          noise.stop(now + 0.4);

          const osc = this.ctx.createOscillator();
          const oscGain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
          oscGain.gain.setValueAtTime(0.9, now);
          oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(oscGain);
          oscGain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        } catch (e) {}
      }
      playClick() {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.06);
        } catch (e) {}
      }
      playChime() {
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.08);
            gain.gain.setValueAtTime(0.2, now + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.3);
          });
        } catch (e) {}
      }
    }
    const audio = new SoundFX();

    const situaciones = [
      {
        titulo: "Ronda 1: La Cuenta Falsa",
        desc: "Descubres que tu pareja tiene una cuenta secundaria de redes donde le tira los perros a terceros. Te dice que 'es solo recocha y que no seas paranoica'."
      },
      {
        titulo: "Ronda 2: El 'Accidente' en el Carro",
        desc: "En una discusión acalorada saliendo de una fiesta, arranca el carro de forma violenta y te golpea la puerta dejándote morados. Al día siguiente jura que 'el pie se le resbaló'."
      },
      {
        titulo: "Ronda 3: El Regalo de Soberbia",
        desc: "Tras insultarte frente a tus amigos, llega a tu casa con una cadena de oro y entradas para un concierto costoso esperando que actúes como si nada pasó."
      },
      {
        titulo: "Ronda 4: La Amenaza de Culpa",
        desc: "Te dice: 'Si me dejas me voy a matar y le voy a decir a tu familia que tú me arruinaste la vida'."
      },
      {
        titulo: "Ronda 5: El Aislamiento Sutil",
        desc: "Empieza a criticar a todos tus amigos diciendo que 'te tienen envidia' y te pide no volver a salir con ellos sin su compañía."
      }
    ];

    let equipoActualId = "1";
    let nombreEquipo = "EQUIPO 1";
    let rondaActual = 0;
    let balasEnTambor = 1;
    let corazonesRestantes = 3; // ❤️ ❤️ ❤️ Sistema de Vidas de la Relación
    let puntosEquipo = 0;
    let limitesPuestosCount = 0;
    let angulo = 0;

    // Estado del Top de Equipos (Persistido en localStorage)
    let leaderboard = JSON.parse(localStorage.getItem('revolver_leaderboard')) || {
      "1": { equipo: "Equipo 1", puntos: 0, corazones: 3, estado: "En Espera" },
      "2": { equipo: "Equipo 2", puntos: 0, corazones: 3, estado: "En Espera" },
      "3": { equipo: "Equipo 3", puntos: 0, corazones: 3, estado: "En Espera" },
      "4": { equipo: "Equipo 4", puntos: 0, corazones: 3, estado: "En Espera" },
      "5": { equipo: "Equipo 5", puntos: 0, corazones: 3, estado: "En Espera" },
      "6": { equipo: "Equipo 6", puntos: 0, corazones: 3, estado: "En Espera" }
    };

    function renderLeaderboard() {
      const container = document.getElementById('leaderboard-container');
      const sorted = Object.keys(leaderboard).map(k => ({ id: k, ...leaderboard[k] }))
        .sort((a, b) => b.puntos - a.puntos);

      let html = `
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>Pos</th>
              <th>Equipo</th>
              <th>Salud</th>
              <th>Puntos</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
      `;

      sorted.forEach((item, index) => {
        const medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `${index + 1}º`;
        const heartsTxt = "❤️".repeat(item.corazones) + "💔".repeat(3 - item.corazones);
        html += `
          <tr>
            <td><strong>${medal}</strong></td>
            <td><strong>${item.equipo}</strong></td>
            <td>${heartsTxt}</td>
            <td><strong style="color:var(--gold);">${item.puntos} pts</strong></td>
            <td><span style="font-size:0.75rem; padding:2px 6px; border-radius:4px; background:${item.estado.includes('Sobrevivió') ? 'rgba(6,214,160,0.2)' : item.estado.includes('Colapsó') ? 'rgba(255,51,102,0.2)' : 'rgba(255,255,255,0.06)'}; color:${item.estado.includes('Sobrevivió') ? 'var(--green)' : item.estado.includes('Colapsó') ? 'var(--red)' : '#aaa'};">${item.estado}</span></td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
      localStorage.setItem('revolver_leaderboard', JSON.stringify(leaderboard));
    }

    function resetLeaderboard() {
      if (confirm("¿Deseas reiniciar la tabla de posiciones de todos los grupos?")) {
        leaderboard = {
          "1": { equipo: "Equipo 1", puntos: 0, corazones: 3, estado: "En Espera" },
          "2": { equipo: "Equipo 2", puntos: 0, corazones: 3, estado: "En Espera" },
          "3": { equipo: "Equipo 3", puntos: 0, corazones: 3, estado: "En Espera" },
          "4": { equipo: "Equipo 4", puntos: 0, corazones: 3, estado: "En Espera" },
          "5": { equipo: "Equipo 5", puntos: 0, corazones: 3, estado: "En Espera" },
          "6": { equipo: "Equipo 6", puntos: 0, corazones: 3, estado: "En Espera" }
        };
        renderLeaderboard();
      }
    }

    function actualizarCorazonesUI() {
      const el = document.getElementById('lbl-corazones');
      if (corazonesRestantes > 0) {
        el.innerText = "❤️".repeat(corazonesRestantes) + "💔".repeat(3 - corazonesRestantes);
      } else {
        el.innerText = "💔💔💔 (COLAPSO TOTAL)";
      }
    }

    function entrarJuego() {
      audio.playClick();
      const sel = document.getElementById('sel-grupo');
      equipoActualId = sel.value;
      nombreEquipo = sel.options[sel.selectedIndex].text.toUpperCase();

      rondaActual = 0;
      balasEnTambor = 1;
      corazonesRestantes = 3;
      puntosEquipo = 0;
      limitesPuestosCount = 0;

      document.getElementById('box-login').style.display = 'none';
      document.getElementById('box-game').style.display = 'block';
      document.getElementById('lbl-grupo').innerText = nombreEquipo;

      actualizarCorazonesUI();
      actualizarTambor();
      mostrarRonda();
    }

    function mostrarRonda() {
      if (corazonesRestantes <= 0) {
        audio.playBang();
        leaderboard[equipoActualId] = {
          equipo: nombreEquipo,
          puntos: puntosEquipo,
          corazones: 0,
          estado: "💥 Colapsó"
        };
        renderLeaderboard();

        document.getElementById('case-title').innerText = "💔 LA RELACIÓN HA COLAPSADO";
        document.getElementById('case-desc').innerHTML = `
          Se agotaron los 3 corazones de salud emocional. Tolerar las banderas rojas acumuló demasiadas balas y causó una agresión irreversible.
          <br><br>
          <strong>Puntuación Final:</strong> ${puntosEquipo} pts.
        `;
        document.getElementById('actions-panel').style.display = 'none';
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('btn-next').style.display = 'none';
        return;
      }

      if (rondaActual >= situaciones.length) {
        audio.playChime();
        const bonoFinal = corazonesRestantes * 100;
        puntosEquipo += bonoFinal;

        leaderboard[equipoActualId] = {
          equipo: nombreEquipo,
          puntos: puntosEquipo,
          corazones: corazonesRestantes,
          estado: "🏆 Sobrevivió"
        };
        renderLeaderboard();

        document.getElementById('case-title').innerText = "SOBREVIVISTE A LA RULETA";
        document.getElementById('case-desc').innerHTML = `
          Demostraron que en una relación abusiva, tolerar banderas rojas es jugar a la ruleta rusa. Como en 'El revólver', poner un límite contundente es lo único que desarma el peligro.
          <br><br>
          <strong>🎯 Puntuación Final: ${puntosEquipo} pts</strong> (Bono por ${corazonesRestantes} corazones restantes).
          <div class="closing-reflection">
            <strong style="color:var(--gold); display:block; margin-bottom:6px;">📖 CIERRE REFLEXIVO (MARVEL MORENO):</strong>
            "En el cuento de Marvel Moreno, Ana María estuvo jugando a la ruleta rusa cada vez que toleraba los maltratos de José Caicedo para cuidar las apariencias sociales, hasta que el carro casi la mata en el garaje. Solo cuando consiguió el revólver y puso un límite irreversible, logró vaciar el tambor y obligar al agresor a vivir con miedo durante treinta años."
          </div>
        `;
        document.getElementById('actions-panel').style.display = 'none';
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('btn-next').style.display = 'none';
        return;
      }

      const s = situaciones[rondaActual];
      document.getElementById('case-title').innerText = s.titulo;
      document.getElementById('case-desc').innerText = s.desc;
      document.getElementById('feedback-box').style.display = 'none';
      document.getElementById('btn-next').style.display = 'none';
      document.getElementById('actions-panel').style.display = 'flex';
    }

    function actualizarTambor() {
      for (let i = 0; i < 6; i++) {
        document.getElementById(`slot-${i}`).className = "chamber " + `c${i+1}`;
      }
      for (let i = 0; i < balasEnTambor; i++) {
        document.getElementById(`slot-${i}`).classList.add('has-bullet');
      }
      document.getElementById('lbl-balas').innerText = `Balas: ${balasEnTambor}/6`;
    }

    function girarTambor(callback) {
      audio.playSpin();
      angulo += 360 + Math.floor(Math.random() * 6) * 60;
      document.getElementById('tambor').style.transform = `rotate(${angulo}deg)`;
      setTimeout(callback, 650);
    }

    function tomarDecision(tipo) {
      document.getElementById('actions-panel').style.display = 'none';
      const fb = document.getElementById('feedback-box');
      fb.style.display = 'block';
      document.getElementById('btn-next').style.display = 'block';

      if (tipo === 'tolerar') {
        balasEnTambor = Math.min(6, balasEnTambor + 1);
        actualizarTambor();

        girarTambor(() => {
          const disparo = Math.random() < (balasEnTambor / 6);
          if (disparo) {
            audio.playBang();
            corazonesRestantes = Math.max(0, corazonesRestantes - 1);
            actualizarCorazonesUI();

            if (navigator.vibrate) navigator.vibrate([150, 50, 150]);
            const f = document.getElementById('flash-screen');
            f.classList.add('active');
            setTimeout(() => f.classList.remove('active'), 120);

            fb.style.background = '#381216';
            fb.style.border = '1px solid var(--red)';
            fb.style.color = '#ffccd5';
            fb.innerHTML = `💥 <b>¡BANG! EL DISPARO SE ACTIVÓ (💔 Pierden 1 Corazón)</b><br>
            Tolerar las agresiones llenó el tambor. El abuso escaló a una agresión física o emocional severa. ¡Les quedan ${corazonesRestantes} corazones de vida!`;
          } else {
            audio.playClick();
            puntosEquipo += 50;
            fb.style.background = '#2b2310';
            fb.style.border = '1px solid var(--gold)';
            fb.style.color = '#ffe082';
            fb.innerHTML = `⚠️ <b>CLIC... TE SALVASTE POR PURA SUERTE (+50 pts)</b><br>
            El arma no disparó esta vez, pero dejaste pasar el abuso y ahora el tambor tiene ${balasEnTambor} balas. En la próxima ronda el peligro es casi seguro.`;
          }

          leaderboard[equipoActualId] = {
            equipo: nombreEquipo,
            puntos: puntosEquipo,
            corazones: corazonesRestantes,
            estado: corazonesRestantes > 0 ? "Jugando" : "💥 Colapsó"
          };
          renderLeaderboard();
        });

      } else {
        balasEnTambor = Math.max(1, balasEnTambor - 1);
        limitesPuestosCount++;
        puntosEquipo += 120;
        actualizarTambor();

        girarTambor(() => {
          audio.playChime();
          fb.style.background = '#0e2b24';
          fb.style.border = '1px solid var(--green)';
          fb.style.color = '#c7f9cc';
          fb.innerHTML = `🛑 <b>LÍMITE ASEGURADO (+120 pts - Estrategia de Ana María)</b><br>
          Frenaron la manipulación en seco. No aceptaron chantajes ni regalos de soborno. Vaciaron una bala del tambor y conservaron sus corazones ❤️.`;

          leaderboard[equipoActualId] = {
            equipo: nombreEquipo,
            puntos: puntosEquipo,
            corazones: corazonesRestantes,
            estado: "Jugando"
          };
          renderLeaderboard();
        });
      }
    }

    function siguienteRonda() {
      audio.playClick();
      rondaActual++;
      mostrarRonda();
    }

    // Inicializar Tabla de Posiciones al Cargar
    renderLeaderboard();
  </script>
</body>
</html>
